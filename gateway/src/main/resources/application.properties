spring.application.name=gateway
server.port=8000

spring.cloud.gateway.server.webflux.routes[0].id=member
spring.cloud.gateway.server.webflux.routes[0].uri=http://127.0.0.1:8001
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/member/**

# 允许前端跨域（Gateway 4.x 全局 CORS 配置）
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/member/**].allowed-origins[0]=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/member/**].allowed-methods[0]=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/member/**].allowed-headers[0]=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/member/**].allowed-origin-patterns[0]=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/member/**].allowCredentials=false
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/member/**].maxAge=18000
